# AI 原生开发者社区 - 私有部署编排
# 生产：docker compose up -d --build  (nginx 反代 web + api)
# 开发：docker compose up -d db redis (本地跑 uvicorn / next dev)
services:
  db:
    build: ./docker/postgres
    container_name: community-db
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: community
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: community-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 生产模式服务 ----
  api:
    build: ./apps/api
    container_name: community-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://community:community@db:5432/community
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    expose:
      - "8000"

  worker:
    build: ./apps/api
    container_name: community-worker
    command: ["python", "-m", "app.tasks.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://community:community@db:5432/community
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    build: ./apps/web
    container_name: community-web
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: community-nginx
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  uploads:
